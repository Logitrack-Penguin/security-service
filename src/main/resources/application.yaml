# =====================================================================
# CONFIGURACIÓN DE SECURITY-SERVICE
# Valores por defecto para desarrollo. En Docker/Compose se sobreescriben
# con variables de entorno y con el Config Server (security-service-<perfil>.yml).
# Los SECRETOS (DB_PASSWORD, JWT_SECRET) no tienen valor por defecto a propósito.
# =====================================================================

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: security-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    # En Docker: CONFIG_SERVER_URL=http://config-server:8085 (nunca localhost entre contenedores)
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8085}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/security_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

# Estas propiedades van en la RAÍZ (no dentro de "spring:")
logitrack:
  jwt:
    # Clave HMAC en Base64 (mínimo 32 bytes). Debe ser la MISMA en shipment-service y courier-service.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:admin@logitrack.local}

logging:
  level:
    ar.edu.unju.fi.arquitecturas.logitrack: ${LOG_LEVEL:INFO}
